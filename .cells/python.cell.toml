name = "python"
purpose = "Python importer: extract file→file import edges via tree-sitter (bundled WASM grammar) + module→file resolution through the census (absolute + relative `.`/`..` imports). One language implementation of the Importer contract (in the imports cell), built on the shared tree-sitter engine. Adding a language = a sibling cell like this one, registered in importers' DEFAULT_IMPORTERS."
provides = ["pythonImporter", "fileToModule"]
requires = ["imports", "tree-sitter"]
layer = 4
