name = "io"
purpose = "Read Cells state from disk (declarations, ownership, config, code files, payload sizes). (Import-edge collection lives in the importers cell; the `crossings --diff` feature + its git machinery live in the diff cell.)"
provides = [
  "loadDeclarations",
  "loadOwnership",
  "loadConfig",
  "readFiles",
  "listCodeFiles",
  "neighborsOf",
  "computePayloadSize",
  "CELLS_DIR",
]
requires = ["declaration", "ownership", "payload", "config", "ignore"]

layer = 2
