name = "io"
purpose = "Read Cells state from disk (declarations, ownership, config, code files) — the store/IO cell: everything that touches the filesystem for the partition lives here. (Import-edge collection lives in the importers cell; the `crossings --diff` feature + its git machinery live in the diff cell.)"
provides = [
  "loadDeclarations",
  "loadOwnership",
  "writeOwnership",
  "loadConfig",
  "loadContext",
  "CellsContext",
  "readFiles",
  "listCodeFiles",
  "detectProject",
  "requireCells",
  "CELLS_DIR",
  "SKIP_DIRS",
]
requires = ["declaration", "ownership", "config", "ignore", "validate"]

layer = 2
