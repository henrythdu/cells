# pnpm v11 dropped onlyBuiltDependencies; use allowBuilds instead.
allowBuilds:
  esbuild: true
# pnpm's pre-run deps-check errors on the ignored esbuild build script;
# vitest runs fine regardless, so skip the check.
verifyDepsBeforeRun: false
# GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895: minimatch 10.2.x
# pins brace-expansion 5.0.7 (DoS). Override to the patched line, scoped to
# the vulnerable range — minimatch 9 (glob@10, used by coverage tooling) still
# needs CJS brace-expansion ^2, which the unscoped override broke.
overrides:
  brace-expansion@^5.0.5: ^5.0.9
