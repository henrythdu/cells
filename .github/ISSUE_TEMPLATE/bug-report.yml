name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Short, concrete, worth reading.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cells --version`
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Commands ran, files touched, what went wrong.
    validations:
      required: true
