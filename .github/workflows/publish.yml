name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC token for provenance-attested publish (no long-lived npm token).
      id-token: write
    steps:
      # Actions pinned to full commit SHAs (zizmor: mutable tags).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
      # --ignore-scripts: the runner's supply-chain install wrapper changed
      # behavior — it now runs the project's prepare before devDeps (node types)
      # are linked, so tsc fails. The build happens explicitly below, with the
      # full tree present.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build && chmod +x dist/cli.js
      - run: pnpm test
      # the tool's own gate before anything ships — a merged commit that fails
      # `cells health` must never reach npm.
      - run: node dist/cli.js health
      - name: Check if version already published
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VER already on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        # --provenance: OIDC-attested build; setup-node exchanges the id-token
        # for a registry token automatically (no NODE_AUTH_TOKEN secret).
        run: pnpm publish --provenance --no-git-checks --ignore-scripts
      - name: Create GitHub Release
        run: gh release create "$TAG" --generate-notes
        env:
          # env, not shell interpolation — no injection surface
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
