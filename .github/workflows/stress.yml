name: Stress

on:
  workflow_dispatch:
  schedule:
    # weekly, Monday 03:00 UTC — big-repo regression signal (~670-cell kafka scale)
    - cron: "0 3 * * 1"

jobs:
  stress:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions pinned to full commit SHAs (mutable tags can be repointed).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node scripts/stress.mjs --cells 600 --files-per-cell 10
