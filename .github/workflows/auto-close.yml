name: Auto-close new issues and PRs

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner = context.repo.owner;
            const author = context.payload.sender.login;

            // Only the repo owner's issues/PRs stay open (dependabot's PRs
            // are CI-vetted dependency bumps — let them through).
            if (author === owner || author === 'dependabot[bot]') return;

            const isPr = context.payload.pull_request !== undefined;
            const type = isPr ? 'pull request' : 'issue';

            const message = [
              `Thanks for opening this ${type}! Maintainers review daily.`,
              '',
              'Cells has a specific vision — see CONTRIBUTING.md.',
              'If the maintainer agrees this fits, it will be reopened.',
              'Otherwise it stays closed — the honest answer: doesn\'t fit.',
              '',
              '— Cells maintainer bot',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });

            await github.rest.issues.update({
              owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
