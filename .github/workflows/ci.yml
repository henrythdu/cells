name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions pinned to full commit SHAs (zizmor: mutable tags can be repointed).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: latest
      # --ignore-scripts: the runner's install wrapper may run the project's
      # prepare before devDeps are linked. The build happens explicitly below.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      # cells' own gate on its own repo — undeclared crossings, integrity,
      # grammars.
      - run: node dist/cli.js health
