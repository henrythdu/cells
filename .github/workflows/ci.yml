name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Actions pinned to full commit SHAs (mutable tags can be repointed).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # --ignore-scripts: the runner's install wrapper may run the project's
      # prepare before devDeps are linked. The build happens explicitly below.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # coverage thresholds are the CI gate (vitest.config.ts)
      - run: pnpm test -- --coverage
      # cells' own gate on its own repo — undeclared crossings, integrity,
      # grammars.
      - run: node dist/cli.js health
